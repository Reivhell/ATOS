[package]
name = "agentic-trading-os"
version = "0.0.1-beta"
description = "Local-first trading research and paper-trading desktop application"
authors = ["Agentic Trading OS contributors"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "agentic_trading_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "query"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tauri = { version = "2", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
keyring = { version = "=4.2", features = ["apple-native-keyring-store", "windows-native-keyring-store", "zbus-secret-service-keyring-store"] }
zeroize = "1.8"
tauri-plugin-dialog = "=2.4.2"
