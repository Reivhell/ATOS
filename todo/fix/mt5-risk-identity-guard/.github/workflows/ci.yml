name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-guardrails:
    timeout-minutes: 20
    name: Bun guardrails and full source test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install locked application dependencies
        run: bun install --frozen-lockfile
      - run: bun run verify:repo
      - run: bun run test
      - name: Run deterministic AI Agent release qualification against the application boundary
        run: bun run eval:agents -- --report-file "$RUNNER_TEMP/agent-reliability-evaluation.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-reliability-evaluation-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-reliability-evaluation.json
          if-no-files-found: warn

  bun-compatibility:
    timeout-minutes: 20
    name: Bun/Hono API integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install locked application dependencies for Hono/Bun adapter validation
        run: bun install --frozen-lockfile
      - name: Run real Hono request/response integration suite
        run: bun test api/test/app.integration.test.ts

  frontend:
    timeout-minutes: 25
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:layers
      - run: bun run build

  rust:
    timeout-minutes: 60
    name: Rust formatting, tests, and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            wget \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action commit
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  tagged-release-build:
    timeout-minutes: 120
    name: Reproducible tagged desktop builds
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Require committed dependency lockfiles
        shell: bash
        run: |
          test -f package-lock.json || { echo "Release blocked: commit package-lock.json before tagging." >&2; exit 1; }
          test -f bun.lock || { echo "Release blocked: commit bun.lock before tagging." >&2; exit 1; }
          test -f src-tauri/Cargo.lock || { echo "Release blocked: commit src-tauri/Cargo.lock before tagging." >&2; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun test scripts/*.test.mjs
      - run: bun test api/test/app.integration.test.ts
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action commit
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Install Tauri Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl file wget libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: bun run release:preflight
      - run: bun run verify:repo
      - run: bun run test
      - run: bun run eval:agents -- --report-file "$RUNNER_TEMP/agent-reliability-evaluation.json"
      - run: bun run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Generate an SPDX SBOM from pinned application and build dependencies
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/agentic-trading-os-sbom.spdx.json
          artifact-name: agentic-trading-os-sbom-${{ matrix.platform }}-${{ github.ref_name }}
          upload-artifact: false
          upload-release-assets: false
      - run: bun run tauri build
      - name: Stage only required, installable artifacts for this platform
        shell: bash
        run: |
          bun run scripts/prepare-release-artifacts.mjs \
            --platform "${{ matrix.platform }}" \
            --bundle-dir src-tauri/target/release/bundle \
            --output-dir "$RUNNER_TEMP/atos-release-staging"
          cp "$RUNNER_TEMP/agentic-trading-os-sbom.spdx.json" "$RUNNER_TEMP/atos-release-staging/sbom.spdx.json"
      - name: Generate release inventory and hashes for staged installers
        shell: bash
        run: bun run release:evidence -- --bundle-dir "$RUNNER_TEMP/atos-release-staging/artifacts" --evidence-dir "$RUNNER_TEMP/atos-release-staging/evidence"
      - name: Verify exact staged installer inventory before attestation
        shell: bash
        run: bun run release:evidence:verify -- --bundle-dir "$RUNNER_TEMP/atos-release-staging/artifacts" --evidence-dir "$RUNNER_TEMP/atos-release-staging/evidence"
      - name: Generate signed SLSA provenance for every staged installer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/atos-release-staging/artifacts/*
      - name: Generate a signed SBOM attestation for the staged installers
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/atos-release-staging/artifacts/*
          sbom-path: ${{ runner.temp }}/atos-release-staging/sbom.spdx.json
      - name: Verify signatures, signer workflow, repository and source tag for every installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run scripts/verify-release-attestation.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-ref "$GITHUB_REF" \
            --bundle-dir "$RUNNER_TEMP/atos-release-staging/artifacts"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentic-trading-os-${{ matrix.os }}-${{ github.ref_name }}
          path: ${{ runner.temp }}/atos-release-staging/**
          if-no-files-found: error
